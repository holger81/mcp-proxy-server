# Test gate for every push/PR. Production runs Python 3.12 (Dockerfile) — CI matches.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: proxy
            dir: .
          - name: news-server
            dir: servers/mcp-news-server
    name: pytest (${{ matrix.target.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            servers/mcp-news-server/pyproject.toml
      - name: Install packages (both, editable — proxy tests import news helpers)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "./servers/mcp-news-server[dev]"
      - name: Run pytest
        working-directory: ${{ matrix.target.dir }}
        run: python -m pytest tests -q
