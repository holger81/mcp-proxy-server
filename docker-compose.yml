# Local dev / Portainer with build:. — CI can SSH to this clone and run compose build (see .github/workflows/deploy.yml).
services:
  mcp-proxy:
    build:
      context: .
      args:
        # Pin https://github.com/tecnologicachile/mail-mcp Linux amd64 release baked into /opt/mail-mcp/
        MAIL_MCP_VERSION: ${MAIL_MCP_VERSION:-v0.4.5}
        # Audit M-9: optional sha256 of the release tarball above; set in .env
        # to fail the build when the GitHub asset changes underneath the pin.
        # MAIL_MCP_SHA256: ${MAIL_MCP_SHA256:-}
    # Local tag only — not on Docker Hub. Prevents `compose pull` / Portainer “Pull” from hitting the registry.
    image: mcp-proxy:latest
    pull_policy: never
    ports:
      - "2222:8080"
      # Audit SEC-3: the Node.js inspector (per-server "stdio node inspect"
      # toggle) binds 0.0.0.0:9229 INSIDE the container; publishing it by
      # default exposed the unauthenticated DevTools protocol (= arbitrary
      # code execution with every API key in /data) on the host LAN. It is no
      # longer published — opt in via docker-compose.debug.yml (loopback only).
    volumes:
      - mcp-proxy-data:/data
      # TLS: drop *.pem / *.crt here (gitignored); merged into OS trust store at container start (mail-mcp IMAP/SMTP).
      - ./docker/extra-ca:/data/extra-ca:ro
      # Match container log timestamps to the host clock (same pattern as Frigate / other stacks).
      - /etc/localtime:/etc/localtime:ro
    environment:
      MCP_PROXY_DATA_DIR: /data
      MCP_PROXY_STATIC_ROOT: /app/static
      # Package installs from the admin UI / proxy tools are OPT-IN (default
      # flipped to disabled in the 2026-10 release). Set true to allow installs.
      # MCP_PROXY_ALLOW_PYPI_INSTALL: "true"
      # MCP_PROXY_ALLOW_NPM_INSTALL: "true"
      # News digest caches under /data/mcp-news/cache (refreshed by proxy, not the short-lived stdio child).
      NEWS_MCP_DATA_DIR: /data/mcp-news
      NEWS_MCP_CACHE_REFRESH_SECONDS: ${NEWS_MCP_CACHE_REFRESH_SECONDS:-600}
      MCP_PROXY_NEWS_DIGEST_REFRESH_ENABLED: ${MCP_PROXY_NEWS_DIGEST_REFRESH_ENABLED:-true}
      # Optional LLM curation during digest refresh (OpenAI-compatible API).
      # Empty MODEL (default) disables the curator; set values in the Portainer stack env.
      # BASE_URL must include the version path, e.g. http://host:9292/v1 for a llama.cpp router.
      NEWS_MCP_LLM_MODEL: ${NEWS_MCP_LLM_MODEL:-}
      NEWS_MCP_LLM_BASE_URL: ${NEWS_MCP_LLM_BASE_URL:-https://api.openai.com/v1}
      NEWS_MCP_LLM_API_KEY: ${NEWS_MCP_LLM_API_KEY:-}
      NEWS_MCP_LLM_TOP_N: ${NEWS_MCP_LLM_TOP_N:-12}
      NEWS_MCP_LLM_INPUT_MAX: ${NEWS_MCP_LLM_INPUT_MAX:-40}
      NEWS_MCP_LLM_SUMMARY_MAX_CHARS: ${NEWS_MCP_LLM_SUMMARY_MAX_CHARS:-1200}
      # Raise above 90 when the endpoint lazy-loads models (cold load would otherwise time out).
      NEWS_MCP_LLM_TIMEOUT_S: ${NEWS_MCP_LLM_TIMEOUT_S:-90}
      NEWS_MCP_LLM_DIGESTS: ${NEWS_MCP_LLM_DIGESTS:-today,germany,local}
      # Default RSS bundle + stdio server `mcp-news` are seeded on first start (see docker/seed_mcp_news.py).
      # Optional: point at your own YAML (must match feeds.yaml shape).
      # MCP_NEWS_DEFAULT_FEEDS: /app/mcp-news-default-feeds.yaml
      # Pass stack / .env values into the container (Portainer “Environment” only applies if referenced here).
      MCP_PROXY_ADMIN_PASSWORD: ${MCP_PROXY_ADMIN_PASSWORD:-}
      MCP_PROXY_SESSION_SECRET: ${MCP_PROXY_SESSION_SECRET:-}
      MCP_PROXY_SECURE_COOKIES: ${MCP_PROXY_SECURE_COOKIES:-false}
      MCP_PROXY_ADMIN_PASSWORD_FILE: ${MCP_PROXY_ADMIN_PASSWORD_FILE:-}
      MCP_PROXY_SESSION_SECRET_FILE: ${MCP_PROXY_SESSION_SECRET_FILE:-}
      # Startup is REFUSED when no password is set and the bind is non-loopback.
      # Set true only for a deliberate open deployment (trusted network).
      MCP_PROXY_ALLOW_NO_AUTH: ${MCP_PROXY_ALLOW_NO_AUTH:-false}
      # PR #38: admin tools on /mcp require the client's can_admin scope.
      # Audit M-8: default flipped to ENFORCE (deny without scope); set 0 to
      # return to warn-only. Fresh installs are safe by default.
      MCP_PROXY_ENFORCE_MCP_ADMIN_TOOLS: ${MCP_PROXY_ENFORCE_MCP_ADMIN_TOOLS:-true}
      # Optional in .env: TZ=America/Denver (IANA). Uses zoneinfo for log timestamps; combine with localtime mount above.
      TZ: ${TZ:-}
      # LLM context caps — override in Portainer stack env or stack.env (0 = unlimited for *_MAX_CHARS).
      MCP_PROXY_TOOL_SEARCH_MAX_MATCHES: ${MCP_PROXY_TOOL_SEARCH_MAX_MATCHES:-25}
      MCP_PROXY_TOOL_DOMAIN_DEFAULT_LIMIT: ${MCP_PROXY_TOOL_DOMAIN_DEFAULT_LIMIT:-20}
      MCP_PROXY_TOOL_DOMAIN_MAX_LIMIT: ${MCP_PROXY_TOOL_DOMAIN_MAX_LIMIT:-100}
      MCP_PROXY_TOOL_DESCRIPTION_MAX_CHARS: ${MCP_PROXY_TOOL_DESCRIPTION_MAX_CHARS:-0}
      MCP_PROXY_TOOL_SERVER_LLM_CONTEXT_MAX_CHARS: ${MCP_PROXY_TOOL_SERVER_LLM_CONTEXT_MAX_CHARS:-0}
      MCP_PROXY_TOOL_INPUT_SCHEMA_MAX_CHARS: ${MCP_PROXY_TOOL_INPUT_SCHEMA_MAX_CHARS:-0}
      MCP_PROXY_CALL_TOOL_RESPONSE_PAGE_CHARS: ${MCP_PROXY_CALL_TOOL_RESPONSE_PAGE_CHARS:-5000}
      MCP_PROXY_CALL_TOOL_RESPONSE_TEXT_MAX_CHARS: ${MCP_PROXY_CALL_TOOL_RESPONSE_TEXT_MAX_CHARS:-0}
      MCP_PROXY_TOOL_DISCOVERY_COMPACT_JSON: ${MCP_PROXY_TOOL_DISCOVERY_COMPACT_JSON:-false}
      MCP_PROXY_INSTRUCTIONS_MAX_CHARS: ${MCP_PROXY_INSTRUCTIONS_MAX_CHARS:-0}
    restart: unless-stopped
    # Audit L-15: the header comment always promised a healthcheck; here it is.
    # /api/health stays public even with auth enabled (see settings.py).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mcp-proxy-data:
